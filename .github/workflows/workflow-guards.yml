# <!-- shared-gate-copy: template/.github/workflows/workflow-guards.yml -->
#
# The check that cannot be silenced by the mistake it exists to catch.
#
# WHY THIS FILE EXISTS
# --------------------
# Every other workflow filters its trigger by branch. That is right for the
# work, and it is also the thing that can go wrong: a workflow that triggers
# on a branch this repository does not have does not fail, it never starts.
# The gates it was supposed to run stay "green" for ever, because nothing ran
# them and nothing reported the absence.
#
# It already happened here. `Zemios/ecosystem` shipped workflows that
# triggered on `main` while the branch of that repository was `master`: the
# eight quality gates of the ecosystem never ran, and the workflow never
# failed. Nothing in the ecosystem could have told, because a missing run and
# a passing run look exactly the same from the outside.
#
# So this workflow has no branch filter at all. It runs on every push, to
# every branch, and it does one thing: it checks that the other workflows
# trigger on branches that exist, and that the trunk is one of them.
#
# It is cheap on purpose. A checkout and Node. No install: the repository has
# no dependencies, and the script it runs has none either.
#
# The gate lives here and not in `gates.yml` for exactly that reason. A gate
# inside the workflow it protects can be switched off by the same mistake;
# a gate in a workflow with no branch filter cannot.

name: workflow-guards

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: workflow guards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The full history and every branch, so the check can compare the
      # triggers against the branches that exist without asking the network.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gate — workflows trigger on branches that exist
        run: node tools/check-workflow-branches.mjs

      # A gate that has never failed is not a gate. This proves the one above
      # can report a red run before anyone has to trust it.
      - name: Gate — the branch gate can actually fail
        run: node tools/check-workflow-branches.test.mjs
